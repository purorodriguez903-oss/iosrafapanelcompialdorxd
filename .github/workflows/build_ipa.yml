name: Compilar IPA iOS

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Instalar XcodeGen
        run: brew install xcodegen

      - name: Generar Proyecto Xcode
        run: xcodegen generate

      - name: Compilar App iOS
        run: |
          xcodebuild -project RafaPanel.xcodeproj \
            -scheme RafaPanel \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/RafaPanel.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Empaquetar IPA
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "*.app" -type d | head -n 1)
          echo "App encontrado en: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r RafaPanel.ipa Payload
          ls -la RafaPanel.ipa

      - name: Subir IPA a Artefactos
        uses: actions/upload-artifact@v4
        with:
          name: RafaPanel-IPA
          path: RafaPanel.ipa
          if-no-files-found: error

      - name: Crear Release en GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "Rafa Panel Free Fire iOS v1.0.0"
          make_latest: true
          body: |
            ### 🎮 Rafa Panel iOS (Free Fire Launcher + Checkboxes)
            Compilación lista para instalar en iPhone/iPad.

            #### 📲 Cómo instalar en tu iPhone:
            - **TrollStore:** Abre el .ipa directamente para instalarlo sin revokes.
            - **AltStore / Sideloadly / Scarlet / Esign:** Firma con tu cuenta de Apple ID e instala.

            #### ✨ Funciones:
            - Botón **Free Fire Normal** para iniciar la aplicación del juego.
            - **Panel flotante táctil:** Arrástralo a cualquier parte de la pantalla.
            - **2 Checkboxes:** Botones ON / OFF con respuesta táctil y visual.
          files: RafaPanel.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
